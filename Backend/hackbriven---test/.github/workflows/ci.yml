name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (excluding faster-whisper - lazily imported, not needed offline)
        run: |
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings \
            httpx python-dotenv Pillow ffmpeg-python static-ffmpeg numpy gradio \
            pytest pytest-mock pytest-asyncio

      - name: Run offline test suite
        run: pytest -q
